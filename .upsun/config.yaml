applications:
  librechat:
    type: "nodejs:20"
    # Node default is the HIGH_CPU profile (memory-lean: max 2240MB). The Vite
    # client build peaks above 2GB and the Node server needs real headroom, so
    # run on HIGH_MEMORY. The build container inherits this profile/size too.
    container_profile: HIGH_MEMORY

    hooks:
      build: |
        set -eu

        echo "==> Build container resources:"
        echo "    cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo unknown)"
        echo "    nproc: $(nproc 2>/dev/null || echo unknown)"

        echo "==> Cloning LibreChat v0.8.5..."
        git clone --depth=1 --branch v0.8.5 https://github.com/danny-avila/LibreChat .librechat

        echo "==> Installing dependencies..."
        cd .librechat
        NODE_ENV=development npm ci

        echo "==> Hardening frontend build: terser -> esbuild minifier..."
        # LibreChat's client vite.config.ts uses minify:'terser', which spawns
        # parallel terser workers that each hold chunk source in memory during
        # "rendering chunks" — the phase that OOM-kills this build. Vite's
        # built-in esbuild minifier does the same job in one bounded process
        # with a fraction of the peak memory. Patch it post-clone and verify the
        # substitution actually applied, so we never silently ship the heavy path.
        sed -i "s/minify: 'terser'/minify: 'esbuild'/" client/vite.config.ts
        grep -q "minify: 'esbuild'" client/vite.config.ts \
          || { echo "E: minify patch did not apply (vite.config.ts changed upstream?)"; exit 1; }

        echo "==> Building frontend..."
        # Keep a heap cap below the container ceiling as a second line of defence
        # so GC stays aggressive if peak memory still climbs.
        NODE_OPTIONS="--max-old-space-size=3072" npm run frontend

        echo "==> LibreChat build done."

    mounts:
      "/librechat":
        source: local
        source_path: librechat
      # Shadow the hardcoded paths in api/config/paths.js with writable mounts
      "/.librechat/uploads":
        source: local
        source_path: librechat-uploads
      "/.librechat/client/public/images":
        source: local
        source_path: librechat-images

    relationships:
      mongodb: "database:mongodb"
      # App-to-app relationship: injects RAG_API_HOST, RAG_API_PORT, RAG_API_SCHEME
      rag_api: "rag-api:http"

    web:
      commands:
        start: "bash start.sh"
      upstream:
        socket_family: tcp
        protocol: http
      locations:
        "/":
          passthru: true

    variables:
      env:
        CONFIG_PATH: "/app/librechat.yaml"
        LIBRECHAT_LOG_DIR: "/app/librechat/logs"
        HOST: "0.0.0.0"
        NODE_ENV: "production"
        ALLOW_REGISTRATION: "true"
        ALLOW_SOCIAL_LOGIN: "false"
        # RAG_API_URL is built at runtime in start.sh from the rag_api relationship vars

      # Secrets — do NOT put values here. Set them with:
      #   upsun variable:create --sensitive=true --name=env:CREDS_KEY    --value=$(openssl rand -hex 32)
      #   upsun variable:create --sensitive=true --name=env:CREDS_IV     --value=$(openssl rand -hex 16)
      #   upsun variable:create --sensitive=true --name=env:JWT_SECRET   --value=$(openssl rand -hex 32)
      #   upsun variable:create --sensitive=true --name=env:JWT_REFRESH_SECRET --value=$(openssl rand -hex 32)

  rag-api:
    type: "python:3.12"

    hooks:
      build: |
        set -eu

        echo "==> Cloning rag_api v0.5.0..."
        git clone --depth=1 --branch v0.5.0 https://github.com/danny-avila/rag_api .rag_api

        echo "==> Installing CPU-only torch (avoids the 2GB GPU wheel)..."
        pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet

        echo "==> Installing rag_api dependencies + sentence-transformers..."
        pip install sentence-transformers langchain-huggingface -r .rag_api/requirements.lite.txt --quiet

        echo "==> RAG API build done."

    mounts:
      "/uploads":
        source: local
        source_path: rag-uploads
      # HuggingFace model cache — persists across deploys so the model is
      # only downloaded once rather than on every container start
      "/hf-cache":
        source: local
        source_path: hf-cache

    relationships:
      postgres: "pgdb:postgresql"

    web:
      commands:
        start: "bash rag_start.sh"
      upstream:
        socket_family: tcp
        protocol: http
      locations:
        "/":
          passthru: true

    variables:
      env:
        VECTOR_DB_TYPE: "pgvector"
        COLLECTION_NAME: "librechat"
        RAG_UPLOAD_DIR: "/app/uploads"
        HF_HOME: "/app/hf-cache"
        # Embeddings: "huggingface" (local, no key) or "openai" (fast, needs OPENAI_API_KEY)
        # Switch with: upsun variable:set env:EMBEDDINGS_PROVIDER openai
        EMBEDDINGS_PROVIDER: "huggingface"

routes:
  "https://{default}/":
    type: upstream
    upstream: "librechat:http"
  "http://{default}/":
    type: redirect
    to: "https://{default}/"

services:
  database:
    type: mongodb-enterprise:7.0
  pgdb:
    type: postgresql:16
    configuration:
      extensions:
        - vector   # pgvector
